app = "wiki-time-machine-joeng03"
primary_region = "arn"

[build]
  dockerfile = "docker/fly/mediawiki.Dockerfile"

[env]
  MW_DB_HOST = "wiki-time-machine-joeng03-db.internal"
  MW_SERVER = "https://wiki-time-machine-joeng03.fly.dev"
  WTM_SERVICE_URL = "http://wiki-time-machine-joeng03-api.internal:8000"

[[mounts]]
  source = "wikiconfig"
  destination = "/data"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/api.php?action=query&meta=siteinfo&format=json"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
